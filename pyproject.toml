[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-local-agent"
version = "0.1.0"
description = "Local Gemma 4 OpenAI-compatible runtime tooling for Apple Silicon."
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=0.26",
  "mlx-vlm>=0.1.29",
  "openai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

